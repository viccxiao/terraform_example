# Lives in each project repo. Shown here for project-example/.
#   PR opened/updated -> deploy to dev.pr_<number> and run it
#   PR closed         -> destroy, which drops the pr_<number> schema
#   merge to main     -> deploy to staging, one at a time
#   tag v*            -> deploy to prod
name: bundle

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["project-example/**"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["project-example/**"]

permissions:
  id-token: write
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc

defaults:
  run:
    working-directory: project-example

jobs:
  pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency: pr-${{ github.event.number }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_DEV_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.BUNDLE_CI_SP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t pr --var schema=pr_${{ github.event.number }}
      - run: databricks bundle deploy -t pr --var schema=pr_${{ github.event.number }}
      - run: databricks bundle run -t pr --var schema=pr_${{ github.event.number }} pricing_features

  pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_DEV_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.BUNDLE_CI_SP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle destroy -t pr --var schema=pr_${{ github.event.number }} --auto-approve

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: staging   # shared environment, one deploy at a time
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_STG_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.TEAM_DEPLOY_SP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t stg

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod   # GitHub environment with required reviewers
    concurrency: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_PROD_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.TEAM_DEPLOY_SP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
