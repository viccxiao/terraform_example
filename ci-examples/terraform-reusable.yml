# Sketch of the shared reusable workflow. Yours already exists: compare and add
# the plan comment and the "unexpected destroy" guard.
name: terraform-reusable

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      command: { type: string, required: true }            # plan | apply
      working-directory: { type: string, default: terraform }

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.11.4 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: eu-west-2

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=backend/${{ inputs.environment }}_backend.tfvars
      - run: terraform validate
      # (existing Trivy and SonarQube steps stay here)

      - name: plan
        run: terraform plan -input=false -out=tfplan -var-file=env/${{ inputs.environment }}.tfvars

      - name: guard against unexpected destroys
        if: inputs.command == 'plan'
        run: |
          terraform show -json tfplan > plan.json
          destroys=$(jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' plan.json)
          if [ -n "$destroys" ]; then
            echo "::warning::This plan destroys resources:"
            echo "$destroys"
            echo "$destroys" | sed 's/^/- /' > destroys.md
          fi

      - name: comment plan on PR
        if: inputs.command == 'plan' && github.event_name == 'pull_request'
        run: |
          { echo "### Plan: ${{ inputs.environment }}"; echo '```'; terraform show -no-color tfplan | tail -n 60; echo '```';
            [ -f destroys.md ] && { echo "**Destroys:**"; cat destroys.md; }; } > comment.md
          gh pr comment ${{ github.event.number }} --body-file comment.md --edit-last || gh pr comment ${{ github.event.number }} --body-file comment.md
        env: { GH_TOKEN: "${{ github.token }}" }

      - name: apply
        if: inputs.command == 'apply'
        run: terraform apply -input=false tfplan
