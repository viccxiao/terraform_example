# STAGE 1: copy into the workspaces repo as the caller workflow.
# PRs plan only. Only main applies, dev -> qa -> prod. Applies are never cancelled.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    concurrency:
      group: plan-${{ github.ref }}-${{ matrix.env }}
      cancel-in-progress: true          # fine for plans
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: ${{ matrix.env }}
      command: plan
    secrets: inherit

  apply-dev:
    if: github.event_name == 'push'
    concurrency:
      group: apply-dev
      cancel-in-progress: false         # never stop an apply part way
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: dev
      command: apply
    secrets: inherit

  apply-qa:
    needs: apply-dev
    concurrency:
      group: apply-qa
      cancel-in-progress: false
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: qa
      command: apply
    secrets: inherit

  apply-prod:
    needs: apply-qa
    concurrency:
      group: apply-prod
      cancel-in-progress: false
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: prod                 # GitHub Environment with required reviewers
      command: apply
    secrets: inherit
