# Plan on PR, apply on merge. One job (and one state file) per changed stack or team,
# so a big change in one team never blocks another.
name: terraform

on:
  pull_request:
    paths: ["platform-infra/**", "team-spaces/**"]
  push:
    branches: [main]
    paths: ["platform-infra/**", "team-spaces/**"]

permissions:
  id-token: write   # GitHub OIDC to Databricks and AWS, no long-lived tokens
  contents: read
  pull-requests: write

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  TF_STATE_BUCKET: zoopla-terraform-state

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detect
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          changed=$(git diff --name-only "$base" HEAD)
          targets=$(
            {
              echo "$changed" | grep -oE '^platform-infra/stacks/[^/]+' | sed 's#^#stack:#'
              echo "$changed" | grep -oE '^team-spaces/teams/[^/]+' | sed 's#team-spaces/teams/#team:#'
              # A module change re-plans every team, pinned versions keep this safe
              if echo "$changed" | grep -q '^platform-infra/modules/'; then
                ls team-spaces/teams | sed 's#^#team:#'
              fi
            } | sort -u | jq -R . | jq -sc .
          )
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  terraform:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.changes.outputs.targets) }}
    concurrency: tf-${{ matrix.target }}   # serialise applies per state, never across teams
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_STATE_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Resolve directory, state key and Databricks principal
        id: t
        run: |
          kind=${MATRIX%%:*}; name=${MATRIX#*:}
          if [ "$kind" = stack ]; then
            echo "dir=platform-infra/stacks/$name" >> "$GITHUB_OUTPUT"
            echo "key=platform-infra/$name.tfstate" >> "$GITHUB_OUTPUT"
            echo "vars=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=team-spaces" >> "$GITHUB_OUTPUT"
            echo "key=team-spaces/$name.tfstate" >> "$GITHUB_OUTPUT"
            echo "vars=-var team=$name" >> "$GITHUB_OUTPUT"
          fi
        env: { MATRIX: "${{ matrix.target }}" }

      - name: terraform init
        working-directory: ${{ steps.t.outputs.dir }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=${{ steps.t.outputs.key }}" -backend-config="region=eu-west-2" -backend-config="use_lockfile=true"

      - name: terraform plan
        working-directory: ${{ steps.t.outputs.dir }}
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_DEV_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.TF_PLATFORM_SP_CLIENT_ID }}
        run: terraform plan -input=false -out=tfplan ${{ steps.t.outputs.vars }}

      - name: terraform apply
        if: github.event_name == 'push'
        working-directory: ${{ steps.t.outputs.dir }}
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_DEV_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.TF_PLATFORM_SP_CLIENT_ID }}
        run: terraform apply -input=false tfplan
