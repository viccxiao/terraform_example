# Pilot product: Smart Tags moves out of the workspaces Terraform root into its own bundle.
bundle:
  name: smart-tags

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog this product writes to
  schema:
    description: Schema this product writes to
    default: smart_tags
  listings_table:
    description: DE contract table Smart Tags reads (read-only)
    default: prod.search_listings.listings

targets:
  # Personal: `databricks bundle deploy` gives you your own prefixed copy, schedules paused
  dev:
    mode: development
    default: true
    workspace:
      host: https://<dev-workspace>.cloud.databricks.com
    variables:
      catalog: data_science
      schema: scratch

  # Pull request: CI runs `databricks bundle deploy -t pr --var schema=pr_<number>`
  pr:
    mode: development
    workspace:
      host: https://<dev-workspace>.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${var.schema}
    variables:
      catalog: dev
    resources:
      schemas:
        pr_schema:
          catalog_name: dev
          name: ${var.schema}
          comment: One schema per pull request. Dropped when the PR closes.

  qa:
    mode: production
    workspace:
      host: https://<qa-workspace>.cloud.databricks.com
    variables:
      catalog: qa
      listings_table: qa.search_listings.listings

  prod:
    mode: production
    workspace:
      host: https://<prod-workspace>.cloud.databricks.com
    variables:
      catalog: prod
