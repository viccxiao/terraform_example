# Example data science project: builds pricing features from DE's published gold tables.
bundle:
  name: pricing-features

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog this project writes to
  schema:
    description: Schema this project writes to
  source_table:
    description: DE contract table this project reads (read-only)
    default: prod.listings_gold.listings

targets:
  # Personal dev: databricks bundle deploy  (resources prefixed with your name, schedules paused)
  dev:
    mode: development
    default: true
    workspace:
      host: https://zoopla-dev.cloud.databricks.com
    variables:
      catalog: ds
      schema: ds_pricing_scratch

  # Pull request: CI runs  databricks bundle deploy -t pr --var schema=pr_<number>
  pr:
    mode: development
    workspace:
      host: https://zoopla-dev.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${var.schema}
    variables:
      catalog: dev
    resources:
      schemas:
        pr_schema:
          catalog_name: dev
          name: ${var.schema}
          comment: Ephemeral schema for one pull request. Dropped on PR close.

  stg:
    mode: production
    workspace:
      host: https://zoopla-stg.cloud.databricks.com
    variables:
      catalog: stg
      schema: ds_pricing
      source_table: stg.listings_gold.listings
    # Deployed by the team's deploy service principal from CI, so jobs run as that principal.

  prod:
    mode: production
    workspace:
      host: https://zoopla-prod.cloud.databricks.com
    variables:
      catalog: prod
      schema: ds_pricing
