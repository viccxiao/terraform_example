resources:
  jobs:
    pricing_features:
      name: pricing-features
      # Run when DE has refreshed its gold table, not on a clock.
      trigger:
        table_update:
          table_names:
            - ${var.source_table}
      tasks:
        - task_key: check_contract
          spark_python_task:
            python_file: ../src/check_contract.py
            parameters: ["--source", "${var.source_table}"]
          environment_key: default

        - task_key: build_features
          depends_on: [{ task_key: check_contract }]
          spark_python_task:
            python_file: ../src/build_features.py
            parameters: ["--source", "${var.source_table}", "--target", "${var.catalog}.${var.schema}.pricing_features"]
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
